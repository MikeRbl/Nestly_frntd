<div class="background-slideshow"></div>

<div class="containerPrincipal">
  
  <img src="https://media.tenor.com/rs3suVPVRKgAAAAm/cxyduck.webp" alt="Pato con letrero" class="pato-gif">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

    <div class="containerUserSvg">
      <img class="logo" src="/assets/navbar/logo.png" alt="Logo">
    </div>

    <h1>Iniciar sesión</h1>

    <div class="form-field">
      <div class="input-group">
        <div class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
          </svg>
        </div>
        <input type="email" placeholder="Correo" formControlName="email" required>
      </div>
      <div *ngIf="email?.touched && email?.invalid" class="error-message">
        <small *ngIf="email?.errors?.['required']">Email es requerido</small>
        <small *ngIf="email?.errors?.['email']">Email no válido</small>
      </div>
    </div>

    <div class="form-field">
      <div class="input-group">
        <div class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
          </svg>
        </div>
        <input [type]="showPassword ? 'text' : 'password'" placeholder="Contraseña" formControlName="password" required>
        <div class="password-toggle" [class.show]="showPassword" (click)="togglePasswordVisibility()">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322...Z"/> <!-- solo 1 path -->
  </svg>
</div>


      </div>
      <div *ngIf="password?.touched && password?.invalid" class="error-message">
        <small *ngIf="password?.errors?.['required']">Contraseña es requerida</small>
      </div>
    </div>

    <button type="submit" class="submit-btn" [disabled]="loading">
      {{ loading ? 'Cargando...' : 'Iniciar sesión' }}
    </button>

    <div class="links">
      
      <a (click)="continueWithoutAccount()">Continuar sin una cuenta</a>
      <a class="register-link" routerLink="/register">Registrarse</a>
    </div>
    <div class="guest-link">
    </div>
  </form>

  <div *ngIf="errorMessage" class="message error">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="message success">
    {{ successMessage }}
  </div>
</div>

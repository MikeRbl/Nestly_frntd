<script>
  // Script para evitar el "flash" del tema claro
  (function () {
    const savedMode = localStorage.getItem("darkModeEnabled");
    if (savedMode === "true") {
      document.documentElement.classList.add("dark");
    }
  })();
</script>
<div class="bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white">
  <nav class="fresh-navbar background bg-gray-50 dark:bg-gray-800">
    <div class="fresh-nav-container background bg-gray-50 dark:bg-gray-800">
      <div class="fresh-logo" routerLink="/principal/dashboard">
        <img src="assets/navbar/LogoN.png" alt="Nestly" />
      </div>
      <div class="fresh-nav-links" [class.active]="mobileMenuOpen">
        <a class="nav-main-link" routerLink="dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenus()">
          <span class="textoBtn">Inicio</span>
        </a>
        <a class="nav-main-link" routerLink="buscarCasa" routerLinkActive="active" (click)="closeMenus()">
          <span class="textoBtn">Buscar</span>
        </a>
        <a class="nav-main-link" routerLink="/principal/gestion-propiedades" routerLinkActive="active" *ngIf="userRole === 'propietario'" (click)="closeMenus()">
          <span class="textoBtn">Propiedades</span>
        </a>
        <a class="nav-main-link" routerLink="/principal/gestion-propiedades/mis-rentas" routerLinkActive="active" *ngIf="userRole === 'inquilino'" (click)="closeMenus()">
          <span class="textoBtn">Mis Rentas</span>
        </a>
        <a class="nav-main-link" routerLink="qnSomos" routerLinkActive="active" (click)="closeMenus()">
          <span class="textoBtn">¿Quiénes somos?</span>
        </a>
        <a class="nav-main-link" routerLink="ser-propietario"  routerLinkActive="active" *ngIf="userRole === 'inquilino'" (click)="closeMenus()">
          <span class="textoBtn">Publica tu propiedad</span>
        </a>
      </div>
      <div class="right-elements flex items-center gap-3">
        <a class="signup-btn" routerLink="/register" *ngIf="!isLoggedIn()">
          <span>Registrarse</span>
        </a>
        <a class="login-btn" routerLink="/login" *ngIf="!isLoggedIn()">
          <span>Iniciar Sesión</span>
        </a>
        
        <div class="user-info-container" *ngIf="isLoggedIn()">
          <div class="user-info" (click)="toggleUserMenu()">
            <div class="flex items-center gap-3">
              <div class="relative">
                <img
                  [src]="userData?.avatar_url || 'assets/navbar/usuario.png'"
                  alt="Foto de perfil de {{ userData?.first_name }}"
                  class="w-10 h-10 rounded-full object-cover ring-2 ring-blue-500 dark:ring-blue-400"
                  loading="lazy"
                />
                <span *ngIf="newFavoritesCount > 0" class="absolute top-0 right-0 block h-2.5 w-2.5 rounded-full bg-red-500 ring-2 ring-white dark:ring-gray-800"></span>
              </div>
              
              <div class="flex flex-col">
                <span class="text-sm font-medium text-gray-900 dark:text-white leading-tight truncate max-w-[150px]" title="{{ userData?.first_name }} {{ userData?.last_name_paternal }}">
                  {{ userData?.first_name }} {{ userData?.last_name_paternal }}
                </span>
                <span class="text-[10px] font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wide">
                  {{ userData?.role | titlecase }}
                </span>
              </div>
            </div>
            <div
              id="user-dropdown-menu"
              class="bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white rounded-md shadow-lg py-1"
              [class.active]="userMenuOpen"
              #userDropdownMenu
            >
              <a routerLink="/admin" *ngIf="userRole === 'admin'" class="dropdown-item block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200 text-yellow-600 dark:text-yellow-400 font-semibold" (click)="closeMenus()">
                Panel de Administración
              </a>
              <a routerLink="/principal/perfil" class="dropdown-item block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200" (click)="closeMenus()">
                Mi Perfil
              </a>
              <a (click)="irAFavoritos()" class="dropdown-item flex justify-between items-center px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                <span>Favoritos</span>
                <span *ngIf="newFavoritesCount > 0" class="flex items-center justify-center h-2 w-2 bg-red-500 rounded-full"></span>
              </a>
              
              <div class="border-t border-gray-200 dark:border-gray-700 mt-1"></div>
              <div class="flex items-center justify-between px-4 py-2">
                <span class="text-sm text-gray-900 dark:text-gray-100">Modo Oscuro</span>
                <button (click)="toggleDarkMode()" class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors duration-300" [ngClass]="darkModeEnabled ? 'bg-blue-600' : 'bg-gray-300'">
                  <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform duration-300" [ngClass]="darkModeEnabled ? 'translate-x-6' : 'translate-x-1'"></span>
                </button>
              </div>
              <a (click)="logout()" class="dropdown-item block px-4 py-2 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-gray-700 transition-colors duration-200">
                Cerrar Sesión
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>
</div>
<router-outlet></router-outlet>

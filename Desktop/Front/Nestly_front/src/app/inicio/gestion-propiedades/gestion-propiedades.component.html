<div class="bg-gray-100 dark:bg-gray-900 p-4 h-screen">
  <div class="flex h-full gap-4">
    <nav class="w-64 bg-white dark:bg-gray-800 rounded-2xl shadow-lg flex flex-col">
      <div class="p-6 flex items-center justify-center border-b border-gray-200 dark:border-gray-700">
        <img src="assets/gif/gifcasa.gif" alt="" class="h-24 w-auto" />
      </div>

      <div class="flex-grow p-4 space-y-2 overflow-y-auto">
        <button
          routerLink="mis-propiedades"
          routerLinkActive="active"
          *ngIf="userRole === 'propietario' || userRole === 'admin'"
          class="nav-link w-full flex justify-between items-center px-4 py-2 rounded hover:bg-blue-50 dark:hover:bg-gray-700 transition"
        >
          <span>Mis Propiedades</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
          </svg>
        </button>
        <button
          routerLink="publicar"
          routerLinkActive="active"
          *ngIf="userRole === 'propietario' || userRole === 'admin'"
          class="nav-link w-full flex justify-between items-center px-4 py-2 rounded hover:bg-blue-50 dark:hover:bg-gray-700 transition"
        >
          <span>Publicar Propiedad</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </button>

        <button
          routerLink="mis-rentas"
          routerLinkActive="active"
          *ngIf="userRole === 'propietario' || userRole === 'inquilino'"
          class="nav-link w-full flex justify-between items-center px-4 py-2 rounded hover:bg-blue-50 dark:hover:bg-gray-700 transition"
        >
          <span>Mis Rentas</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
          </svg>
        </button>

      </div>
    </nav>

    <main class="flex-1 h-full">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 md:p-8 h-full overflow-y-auto">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
  <app-footer></app-footer>

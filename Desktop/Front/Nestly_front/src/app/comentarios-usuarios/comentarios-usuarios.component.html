<section class="bg-slate-50 dark:bg-gray-900 py-12 sm:py-16">
  <div class="container mx-auto px-4">
    <div class="text-center mb-10">
      <h2 class="text-3xl font-bold text-slate-800 dark:text-white">
        Lo que dicen nuestros clientes
      </h2>
      <p class="mt-2 text-md text-slate-600 dark:text-slate-400">
        Descubre por qué cientos de usuarios confían en Nestly para encontrar su hogar ideal.
      </p>
      <div class="mt-6" *ngIf="isUserLoggedIn">
        <button (click)="abrirModalResena()" 
                class="bg-[#7FA6FF] text-white font-semibold px-6 py-3 rounded-lg shadow-md hover:bg-[#6b8eef] transition-all duration-300">
            Escribe tu Reseña
        </button>
        </div>

    </div>

    <!-- El formulario que estaba aquí ahora se ha eliminado -->

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-16">
      <div *ngFor="let testimonio of testimoniosVisibles; let i = index" 
           class="bg-white/60 dark:bg-gray-800/50 backdrop-blur-md rounded-3xl p-8 shadow-lg border border-slate-200 dark:border-slate-700 hover:shadow-2xl transition-all duration-300 relative">
        
        <button *ngIf="isUserLoggedIn && testimonio.id_usuario === currentUser?.id" 
                (click)="eliminarResena(i, $event)"
                class="absolute top-3 right-3 p-1 text-gray-400 hover:text-red-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
        </button>

        <div class="flex flex-col gap-4 h-full justify-between">
          <div class="text-5xl text-[#7FA6FF] dark:text-[#D98EDF] font-serif leading-none"> &ldquo; </div>
          <p class="text-slate-700 dark:text-slate-200 text-base italic leading-relaxed"> {{ testimonio.comentario }} </p>
          <div class="mt-6 flex items-center gap-4 border-t pt-4 border-slate-200 dark:border-gray-600">
            <img [src]="testimonio.avatar" [alt]="testimonio.nombre" class="w-14 h-14 rounded-full object-cover border-2 border-[#7FA6FF]" />
            <div>
              <p class="font-semibold text-slate-800 dark:text-slate-100"> {{ testimonio.nombre }} </p>
              <div class="flex gap-1 mt-1">
                <ng-container *ngFor="let star of [1, 2, 3, 4, 5]">
                  <span class="text-lg" [ngClass]="{'text-yellow-400': star <= testimonio.puntuacion, 'text-gray-300 dark:text-gray-600': star > testimonio.puntuacion}">★</span>
                </ng-container>
              </div>
              <p *ngIf="testimonio.fecha" class="text-xs text-slate-500 dark:text-slate-400 mt-1">{{ testimonio.fecha }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Botón para alternar -->
    <div class="text-center mt-8" *ngIf="testimonios.length > 3">
      <button (click)="mostrarTodasResenas = !mostrarTodasResenas"
              class="bg-[#7FA6FF] text-white px-6 py-2 rounded-lg hover:bg-[#6b8eef] transition">
        {{ mostrarTodasResenas ? 'Ver menos' : 'Ver todas las reseñas' }}
      </button>
    </div>
  </div>
</section>
